# Cocogitto. `cog verify` (the commit-msg hook) enforces conventional commits;
# `cog bump --auto` (release.sh) derives the SemVer bump from history.
from_latest_tag = false
ignore_merge_commits = true
tag_prefix = "v"

# The version lives in four files. The bump sets all of them, refreshes both
# lockfiles, and stages the lot so it lands in the version commit.
pre_bump_hooks = [
  "perl -0pi -e 's/^version = \"[^\"]+\"/version = \"{{version}}\"/m' Cargo.toml apps/desktop/src-tauri/Cargo.toml",
  "perl -0pi -e 's/\"version\": \"[^\"]+\"/\"version\": \"{{version}}\"/' apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json",
  "cargo update --workspace --offline",
  "cd apps/desktop && cargo update --workspace --offline",
  "git add Cargo.toml Cargo.lock apps/desktop/Cargo.lock apps/desktop/package.json apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/tauri.conf.json",
]

[changelog]
path = "CHANGELOG.md"
