# cargo-deny policy for the desktop app's OWN cargo workspace (this
# directory). cargo-deny does not see this workspace from the root, so without
# this file an advisory against tauri, wry or a plugin would never be reported.
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Each is an unmaintained crate (not a vulnerability) reached only through
# Tauri's Linux-only dependencies, which are not compiled for macOS
# (`cargo tree -i <crate> --target aarch64-apple-darwin` finds nothing). Drop
# an entry as soon as the Tauri release in Cargo.toml moves off it.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, via gtk3-macros: the Linux-only GTK3 binding of wry and tauri" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant, via zbus: the Linux-only D-Bus dependency of tauri-plugin-single-instance" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, via zbus: the Linux-only D-Bus dependency of tauri-plugin-single-instance" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, via zbus: the Linux-only D-Bus dependency of tauri-plugin-single-instance" },
]

[licenses]
# The root policy (permissive only) plus what Tauri's own tree needs. All are
# OSI-approved; MPL-2.0 is file-level copyleft that applies to changes to
# those crates' own files, which an app links unmodified.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    # alloc-no-stdlib, alloc-stdlib, brotli (Tauri's asset compression)
    "BSD-3-Clause",
    # foldhash
    "Zlib",
    # target-lexicon (via the build tooling)
    "Apache-2.0 WITH LLVM-exception",
    # cssparser, cssparser-macros, dtoa-short, selectors (wry's HTML handling), option-ext
    "MPL-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
# Tauri's tree carries several versions of the same crate (syn, toml,
# windows-sys, ...); nothing here can unify them.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
