name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy --strict
      - run: uv run pytest

  # The template is a live app: scaffold it under a hyphenated name and run
  # the generated app's full gate (scripts/test-template.sh).
  template:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      # rustup reads template/rust-toolchain.toml, so the pin lives in one place.
      - name: Install the Rust toolchain from the template's rust-toolchain.toml
        working-directory: template
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: template/apps/desktop/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: lts/*
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-machete,cargo-sort,cargo-mutants,typos
      # Not in install-action's manifest list.
      - run: brew install lefthook cocogitto gitleaks
      # The initial commit of a scaffold needs an identity.
      - run: |
          git config --global user.name "tinderbox CI"
          git config --global user.email "ci@users.noreply.github.com"
      - run: uv sync --locked
      # On failure, the log tail becomes an annotation, readable on the run page
      # (and through the API) without downloading the job log.
      - name: Scaffold the template and run its full gate
        run: |
          set -o pipefail
          if ! scripts/test-template.sh 2>&1 | tee template.log; then
            tail -n 80 template.log | perl -0777 -pe 's/\e\[[0-9;]*m//g; s/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; $_ = "::error title=template gate failed::$_\n"'
            exit 1
          fi
